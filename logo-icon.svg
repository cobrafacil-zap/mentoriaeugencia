<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Social Marketing EUA">
  <defs>
    <linearGradient id="brGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1FB874"/><stop offset="1" stop-color="#148F5C"/>
    </linearGradient>
    <linearGradient id="brYel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/><stop offset="1" stop-color="#F2B71E"/>
    </linearGradient>
    <linearGradient id="usRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E54A5C"/><stop offset="1" stop-color="#C42E40"/>
    </linearGradient>
    <linearGradient id="usNavy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3B5A9A"/><stop offset="1" stop-color="#2A4275"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular dark -->
  <circle cx="100" cy="100" r="98" fill="#0B0F1A" stroke="#242D40" stroke-width="2"/>

  <!-- Mastro -->
  <rect x="40" y="30" width="4" height="140" rx="2" fill="#A9B0BF"/>
  <circle cx="42" cy="32" r="4" fill="#22D3EE"/>

  <!-- Bandeira BR -->
  <g transform="translate(46,42)">
    <path d="M 0 0 Q 20 -3 40 0 Q 60 3 80 0 L 80 56 Q 60 59 40 56 Q 20 53 0 56 Z" fill="url(#brGrad)"/>
    <polygon points="40,8 64,28 40,48 16,28" fill="url(#brYel)"/>
    <circle cx="40" cy="28" r="10" fill="#2C4A82"/>
  </g>

  <!-- Bandeira EUA (sobreposta) -->
  <g transform="translate(132,42)">
    <path d="M 0 0 Q 16 -2 32 0 Q 48 2 64 0 L 64 50 Q 48 52 32 50 Q 16 48 0 50 Z" fill="url(#usRed)"/>
    <path d="M 0 8 Q 16 6 32 8 Q 48 10 64 8 L 64 18 Q 48 20 32 18 Q 16 16 0 18 Z" fill="#F2F4F7"/>
    <path d="M 0 26 Q 16 24 32 26 Q 48 28 64 26 L 64 36 Q 48 38 32 36 Q 16 34 0 36 Z" fill="#F2F4F7"/>
    <path d="M 0 44 Q 16 42 32 44 Q 48 46 64 44 L 64 50 Q 48 52 32 50 Q 16 48 0 50 Z" fill="#F2F4F7"/>
    <path d="M 0 0 Q 16 -2 32 0 L 32 22 Q 16 24 0 22 Z" fill="url(#usNavy)"/>
    <g fill="#F2F4F7">
      <circle cx="5" cy="4" r="0.9"/><circle cx="11" cy="4" r="0.9"/><circle cx="17" cy="4" r="0.9"/><circle cx="23" cy="4" r="0.9"/><circle cx="29" cy="4" r="0.9"/>
      <circle cx="8" cy="10" r="0.9"/><circle cx="14" cy="10" r="0.9"/><circle cx="20" cy="10" r="0.9"/><circle cx="26" cy="10" r="0.9"/>
      <circle cx="5" cy="16" r="0.9"/><circle cx="11" cy="16" r="0.9"/><circle cx="17" cy="16" r="0.9"/><circle cx="23" cy="16" r="0.9"/><circle cx="29" cy="16" r="0.9"/>
    </g>
  </g>

  <!-- Detalhe cyan embaixo -->
  <circle cx="42" cy="168" r="3" fill="#22D3EE" opacity=".7"/>

  <!-- Texto "SM" centralizado embaixo -->
  <text x="100" y="195" font-family="'Archivo', system-ui, sans-serif" font-size="22" font-weight="900" fill="#22D3EE" text-anchor="middle" letter-spacing="2">SM</text>
</svg>