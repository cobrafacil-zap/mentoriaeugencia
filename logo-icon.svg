<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Social Marketing EUA">
  <defs>
    <linearGradient id="brGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1FB874"/><stop offset="1" stop-color="#148F5C"/>
    </linearGradient>
    <linearGradient id="brYel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/><stop offset="1" stop-color="#F2B71E"/>
    </linearGradient>
    <linearGradient id="usRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E54A5C"/><stop offset="1" stop-color="#C42E40"/>
    </linearGradient>
    <linearGradient id="usNavy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3B5A9A"/><stop offset="1" stop-color="#2A4275"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular dark -->
  <circle cx="100" cy="100" r="96" fill="#0B0F1A" stroke="#242D40" stroke-width="2"/>

  <!-- Mastro centralizado -->
  <rect x="98" y="22" width="4" height="120" rx="2" fill="#A9B0FF"/>
  <circle cx="100" cy="22" r="5" fill="#22D3EE"/>

  <!-- Bandeira BR (esquerda) -->
  <g transform="translate(20,30)">
    <path d="M 0 0 Q 18 -3 36 0 Q 54 3 72 0 L 72 64 Q 54 67 36 64 Q 18 61 0 64 Z" fill="url(#brGrad)"/>
    <polygon points="36,10 60,32 36,54 12,32" fill="url(#brYel)"/>
    <circle cx="36" cy="32" r="11" fill="#2C4A82"/>
  </g>

  <!-- Bandeira EUA (direita) -->
  <g transform="translate(108,30)">
    <path d="M 0 0 Q 16 -2 32 0 Q 48 2 64 0 L 64 56 Q 48 58 32 56 Q 16 54 0 56 Z" fill="url(#usRed)"/>
    <path d="M 0 9 Q 16 7 32 9 Q 48 11 64 9 L 64 19 Q 48 21 32 19 Q 16 17 0 19 Z" fill="#F2F4F7"/>
    <path d="M 0 28 Q 16 26 32 28 Q 48 30 64 28 L 64 38 Q 48 40 32 38 Q 16 36 0 38 Z" fill="#F2F4F7"/>
    <path d="M 0 47 Q 16 45 32 47 Q 48 49 64 47 L 64 56 Q 48 58 32 56 Q 16 54 0 56 Z" fill="#F2F4F7"/>
    <path d="M 0 0 Q 16 -2 32 0 L 32 24 Q 16 26 0 24 Z" fill="url(#usNavy)"/>
    <g fill="#F2F4F7">
      <circle cx="5" cy="5" r="1"/><circle cx="11" cy="5" r="1"/><circle cx="17" cy="5" r="1"/><circle cx="23" cy="5" r="1"/><circle cx="29" cy="5" r="1"/>
      <circle cx="8" cy="11" r="1"/><circle cx="14" cy="11" r="1"/><circle cx="20" cy="11" r="1"/><circle cx="26" cy="11" r="1"/>
      <circle cx="5" cy="17" r="1"/><circle cx="11" cy="17" r="1"/><circle cx="17" cy="17" r="1"/><circle cx="23" cy="17" r="1"/><circle cx="29" cy="17" r="1"/>
    </g>
  </g>

  <!-- Bolinha embaixo do mastro -->
  <circle cx="100" cy="140" r="3" fill="#22D3EE" opacity=".7"/>

  <!-- Texto "SM" centralizado embaixo -->
  <text x="100" y="180" font-family="'Archivo', system-ui, sans-serif" font-size="20" font-weight="900" fill="#22D3EE" text-anchor="middle" letter-spacing="3">SM</text>
</svg>