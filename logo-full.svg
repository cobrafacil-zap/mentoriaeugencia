<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Social Marketing EUA — bandeiras do Brasil e dos Estados Unidos">
  <defs>
    <linearGradient id="brGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1FB874"/><stop offset="1" stop-color="#148F5C"/>
    </linearGradient>
    <linearGradient id="brYel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/><stop offset="1" stop-color="#F2B71E"/>
    </linearGradient>
    <linearGradient id="usRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E54A5C"/><stop offset="1" stop-color="#C42E40"/>
    </linearGradient>
    <linearGradient id="usNavy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3B5A9A"/><stop offset="1" stop-color="#2A4275"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grupo centrado: as duas bandeiras (sem mastro, sem texto) -->
  <g transform="translate(360,160)">

    <!-- ==== Bandeira Brasil (esquerda) — 320x224, centrada em (-180, 0) ==== -->
    <g transform="translate(-340,-112)">
      <!-- Tecido -->
      <path d="M 0 0 Q 80 -10 160 0 Q 240 10 320 0 L 320 224 Q 240 234 160 224 Q 80 214 0 224 Z"
            fill="url(#brGrad)" filter="url(#shadow)"/>
      <!-- Losango amarelo -->
      <polygon points="160,32 264,112 160,192 56,112" fill="url(#brYel)"/>
      <!-- Círculo azul + cinturão + estrelas -->
      <circle cx="160" cy="112" r="38" fill="#2C4A82"/>
      <path d="M 130 100 Q 160 114 190 100" stroke="#F2F4F7" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 130 122 Q 160 110 190 122" stroke="#F2F4F7" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Pequena "faixa" branca -->
      <rect x="0" y="98" width="320" height="4" fill="#F2F4F7" opacity=".18"/>
    </g>

    <!-- ==== Bandeira EUA (direita) — 320x208, centrada em (180, 0), com leve "abanando" ==== -->
    <g transform="translate(20,-104)">
      <!-- Tecido vermelho/branco -->
      <path d="M 0 0 Q 70 -6 140 0 Q 210 6 280 0 L 320 -2 L 320 210 Q 280 212 210 210 Q 140 216 70 210 Q 0 204 0 210 L 0 0 Z"
            fill="url(#usRed)" filter="url(#shadow)"/>
      <!-- Faixas brancas horizontais -->
      <path d="M 0 32 Q 70 26 140 32 Q 210 38 280 32 L 320 30 L 320 64 Q 280 66 210 64 Q 140 70 70 64 Q 0 58 0 64 Z" fill="#F2F4F7"/>
      <path d="M 0 96 Q 70 90 140 96 Q 210 102 280 96 L 320 94 L 320 128 Q 280 130 210 128 Q 140 134 70 128 Q 0 122 0 128 Z" fill="#F2F4F7"/>
      <path d="M 0 160 Q 70 154 140 160 Q 210 166 280 160 L 320 158 L 320 192 Q 280 194 210 192 Q 140 198 70 192 Q 0 186 0 192 Z" fill="#F2F4F7"/>
      <!-- Cantinho azul -->
      <path d="M 0 0 Q 70 -6 140 0 Q 160 -1 168 0 L 168 78 Q 160 79 140 78 Q 70 84 0 78 Z" fill="url(#usNavy)"/>
      <!-- Estrelinhas (4 linhas × 6 cols) -->
      <g fill="#F2F4F7">
        <!-- linha y=12 -->
        <circle cx="10" cy="10" r="2"/><circle cx="34" cy="10" r="2"/><circle cx="58" cy="10" r="2"/>
        <circle cx="82" cy="10" r="2"/><circle cx="106" cy="10" r="2"/><circle cx="130" cy="10" r="2"/>
        <!-- linha y=30 -->
        <circle cx="22" cy="30" r="2"/><circle cx="46" cy="30" r="2"/><circle cx="70" cy="30" r="2"/>
        <circle cx="94" cy="30" r="2"/><circle cx="118" cy="30" r="2"/><circle cx="142" cy="30" r="2"/>
        <!-- linha y=48 -->
        <circle cx="10" cy="48" r="2"/><circle cx="34" cy="48" r="2"/><circle cx="58" cy="48" r="2"/>
        <circle cx="82" cy="48" r="2"/><circle cx="106" cy="48" r="2"/><circle cx="130" cy="48" r="2"/>
        <!-- linha y=66 -->
        <circle cx="22" cy="66" r="2"/><circle cx="46" cy="66" r="2"/><circle cx="70" cy="66" r="2"/>
        <circle cx="94" cy="66" r="2"/><circle cx="118" cy="66" r="2"/><circle cx="142" cy="66" r="2"/>
      </g>
    </g>

    <!-- Pequeno glow cyan atrás, sutil -->
    <ellipse cx="0" cy="120" rx="320" ry="14" fill="#22D3EE" opacity=".06"/>
  </g>
</svg>
