<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Social Marketing EUA">
  <defs>
    <linearGradient id="brGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1FB874"/><stop offset="1" stop-color="#148F5C"/>
    </linearGradient>
    <linearGradient id="brYel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/><stop offset="1" stop-color="#F2B71E"/>
    </linearGradient>
    <linearGradient id="usRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E54A5C"/><stop offset="1" stop-color="#C42E40"/>
    </linearGradient>
    <linearGradient id="usNavy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3B5A9A"/><stop offset="1" stop-color="#2A4275"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E8FA8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============ Mastro centralizado ============ -->
  <g transform="translate(360,28)">
    <!-- Haste -->
    <rect x="-2" y="0" width="4" height="200" rx="2" fill="#A9B0BF"/>
    <!-- Pomo no topo -->
    <circle cx="0" cy="2" r="6" fill="#22D3EE"/>
    <circle cx="0" cy="2" r="11" fill="#22D3EE" opacity=".25"/>
    <!-- Bolinha na base -->
    <circle cx="0" cy="198" r="5" fill="#22D3EE" opacity=".75"/>

    <!-- Bandeira Brasil (esquerda) — 220x150 -->
    <g transform="translate(-230,15)">
      <path d="M 0 0 Q 55 -6 110 0 Q 165 6 220 0 L 220 150 Q 165 156 110 150 Q 55 144 0 150 Z"
            fill="url(#brGrad)" filter="url(#shadow)"/>
      <polygon points="110,22 178,75 110,128 42,75" fill="url(#brYel)"/>
      <circle cx="110" cy="75" r="25" fill="#2C4A82"/>
      <path d="M 90 67 Q 110 75 130 67" stroke="#F2F4F7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M 90 83 Q 110 75 130 83" stroke="#F2F4F7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Bandeira EUA (direita) — 200x140 -->
    <g transform="translate(30,15)">
      <path d="M 0 0 Q 40 -4 80 0 Q 120 4 160 0 Q 180 -2 200 0 L 200 138 Q 180 140 160 138 Q 120 142 80 138 Q 40 134 0 138 Z"
            fill="url(#usRed)" filter="url(#shadow)"/>
      <path d="M 0 22 Q 40 18 80 22 Q 120 26 160 22 Q 180 20 200 22 L 200 38 Q 180 40 160 38 Q 120 42 80 38 Q 40 34 0 38 Z" fill="#F2F4F7"/>
      <path d="M 0 60 Q 40 56 80 60 Q 120 64 160 60 Q 180 58 200 60 L 200 76 Q 180 78 160 76 Q 120 80 80 76 Q 40 72 0 76 Z" fill="#F2F4F7"/>
      <path d="M 0 98 Q 40 94 80 98 Q 120 102 160 98 Q 180 96 200 98 L 200 114 Q 180 116 160 114 Q 120 118 80 114 Q 40 110 0 114 Z" fill="#F2F4F7"/>
      <!-- Canton azul -->
      <path d="M 0 0 Q 40 -4 80 0 Q 90 -1 100 0 L 100 54 Q 90 55 80 54 Q 40 58 0 54 Z" fill="url(#usNavy)"/>
      <!-- Estrelinhas (4 linhas, 7 cols) -->
      <g fill="#F2F4F7">
        <circle cx="10" cy="10" r="1.8"/><circle cx="22" cy="10" r="1.8"/><circle cx="34" cy="10" r="1.8"/>
        <circle cx="46" cy="10" r="1.8"/><circle cx="58" cy="10" r="1.8"/><circle cx="70" cy="10" r="1.8"/><circle cx="82" cy="10" r="1.8"/>
        <circle cx="16" cy="22" r="1.8"/><circle cx="28" cy="22" r="1.8"/><circle cx="40" cy="22" r="1.8"/>
        <circle cx="52" cy="22" r="1.8"/><circle cx="64" cy="22" r="1.8"/><circle cx="76" cy="22" r="1.8"/>
        <circle cx="10" cy="34" r="1.8"/><circle cx="22" cy="34" r="1.8"/><circle cx="34" cy="34" r="1.8"/>
        <circle cx="46" cy="34" r="1.8"/><circle cx="58" cy="34" r="1.8"/><circle cx="70" cy="34" r="1.8"/><circle cx="82" cy="34" r="1.8"/>
        <circle cx="16" cy="46" r="1.8"/><circle cx="28" cy="46" r="1.8"/><circle cx="40" cy="46" r="1.8"/>
        <circle cx="52" cy="46" r="1.8"/><circle cx="64" cy="46" r="1.8"/><circle cx="76" cy="46" r="1.8"/>
      </g>
    </g>
  </g>

  <!-- ============ Texto ============ -->
  <g font-family="'Archivo', system-ui, sans-serif" text-anchor="middle">
    <!-- Título — fonte menor pra caber sem corte -->
    <text x="360" y="298" font-size="44" font-weight="800" fill="#F2F4F7" letter-spacing="2.5">SOCIAL MARKETING <tspan fill="url(#cyanText)" font-weight="900">EUA</tspan></text>
    <!-- Linha cyan decorativa -->
    <rect x="330" y="316" width="60" height="3" rx="1.5" fill="#22D3EE"/>
    <!-- Subtítulo -->
    <text x="360" y="346" font-size="13" font-weight="600" fill="#8B93A5" letter-spacing="5" font-family="'Inter', system-ui, sans-serif">CAPTAÇÃO DE CLIENTES NOS EUA</text>
  </g>
</svg>
