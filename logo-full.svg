<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="Social Marketing EUA">
  <defs>
    <!-- Sombra leve pra dar profundidade -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradiente sutil nas bandeiras -->
    <linearGradient id="brGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1FB874"/>
      <stop offset="1" stop-color="#148F5C"/>
    </linearGradient>
    <linearGradient id="brYel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#F2B71E"/>
    </linearGradient>
    <linearGradient id="usRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E54A5C"/>
      <stop offset="1" stop-color="#C42E40"/>
    </linearGradient>
    <linearGradient id="usNavy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3B5A9A"/>
      <stop offset="1" stop-color="#2A4275"/>
    </linearGradient>

    <!-- Gradiente do texto EUA -->
    <linearGradient id="cyanGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E8FA8"/>
    </linearGradient>
  </defs>

  <!-- ============ Mastro ============ -->
  <g transform="translate(50,18)">
    <!-- Mastro -->
    <rect x="2" y="0" width="4" height="180" rx="2" fill="#A9B0BF"/>
    <!-- Ponta do mastro -->
    <circle cx="4" cy="2" r="5" fill="#22D3EE"/>
    <circle cx="4" cy="2" r="9" fill="#22D3EE" opacity=".25"/>

    <!-- ============ Bandeira BR (esquerda) ============ -->
    <g transform="translate(8,18)">
      <!-- Ondulação leve -->
      <path d="M 0 0
               Q 30 -4 60 0
               Q 90 4 120 0
               L 120 80
               Q 90 84 60 80
               Q 30 76 0 80 Z"
            fill="url(#brGrad)" filter="url(#dropShadow)"/>
      <!-- Losango amarelo -->
      <polygon points="60,12 96,40 60,68 24,40" fill="url(#brYel)"/>
      <!-- Círculo azul -->
      <circle cx="60" cy="40" r="14" fill="#2C4A82"/>
      <!-- Listras brancas no círculo -->
      <path d="M 50 32 Q 60 36 70 32" stroke="#F2F4F7" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M 50 48 Q 60 44 70 48" stroke="#F2F4F7" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- ============ Bandeira EUA (direita, sobreposta) ============ -->
    <g transform="translate(140,18)">
      <!-- Tiras vermelhas e brancas -->
      <path d="M 0 0
               Q 28 -3 56 0
               Q 84 3 112 0
               L 112 72
               Q 84 75 56 72
               Q 28 69 0 72 Z"
            fill="url(#usRed)" filter="url(#dropShadow)"/>
      <!-- Tiras brancas sobrepostas -->
      <path d="M 0 12 Q 28 9 56 12 Q 84 15 112 12 L 112 24 Q 84 27 56 24 Q 28 21 0 24 Z" fill="#F2F4F7"/>
      <path d="M 0 36 Q 28 33 56 36 Q 84 39 112 36 L 112 48 Q 84 51 56 48 Q 28 45 0 48 Z" fill="#F2F4F7"/>
      <path d="M 0 60 Q 28 57 56 60 Q 84 63 112 60 L 112 72 Q 84 75 56 72 Q 28 69 0 72 Z" fill="#F2F4F7"/>
      <!-- Canton azul -->
      <path d="M 0 0 Q 28 -3 56 0 L 56 30 Q 28 33 0 30 Z" fill="url(#usNavy)"/>
      <!-- Estrelas (pontos) -->
      <g fill="#F2F4F7">
        <circle cx="8" cy="6" r="1.2"/><circle cx="16" cy="6" r="1.2"/><circle cx="24" cy="6" r="1.2"/><circle cx="32" cy="6" r="1.2"/><circle cx="40" cy="6" r="1.2"/><circle cx="48" cy="6" r="1.2"/>
        <circle cx="12" cy="13" r="1.2"/><circle cx="20" cy="13" r="1.2"/><circle cx="28" cy="13" r="1.2"/><circle cx="36" cy="13" r="1.2"/><circle cx="44" cy="13" r="1.2"/>
        <circle cx="8" cy="20" r="1.2"/><circle cx="16" cy="20" r="1.2"/><circle cx="24" cy="20" r="1.2"/><circle cx="32" cy="20" r="1.2"/><circle cx="40" cy="20" r="1.2"/><circle cx="48" cy="20" r="1.2"/>
      </g>
    </g>

    <!-- ============ Detalhe cyan embaixo ============ -->
    <circle cx="4" cy="178" r="4" fill="#22D3EE" opacity=".7"/>
  </g>

  <!-- ============ Texto ============ -->
  <g font-family="'Archivo', system-ui, sans-serif" text-anchor="start">
    <!-- Linha 1: SOCIAL MARKETING -->
    <text x="50" y="160" font-size="32" font-weight="700" fill="#F2F4F7" letter-spacing="2.5">SOCIAL MARKETING</text>
    <!-- Linha 2: EUA (maior, cyan) -->
    <text x="50" y="200" font-size="44" font-weight="900" fill="url(#cyanGrad)" letter-spacing="3">EUA</text>
    <!-- Pequeno traço decorativo -->
    <rect x="50" y="208" width="60" height="2" fill="#22D3EE"/>
    <!-- Subtítulo -->
    <text x="118" y="212" font-size="9.5" font-weight="600" fill="#8B93A5" letter-spacing="2.5" font-family="'Inter', system-ui, sans-serif">CAPTAÇÃO DE CLIENTES NOS EUA</text>
  </g>
</svg>